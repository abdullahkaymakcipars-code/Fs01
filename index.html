<title>Füsun Ece - Erikli Prenses Koşusu v0.8</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#0d0d10;font-family:ui-rounded,"SF Pro Rounded","Trebuchet MS",system-ui,sans-serif;overscroll-behavior:none}
body{min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:0}
#gameShell{position:relative;width:min(100vw,1200px);aspect-ratio:2/1;overflow:hidden;background:#72b9f7;user-select:none;-webkit-user-select:none;touch-action:manipulation}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;z-index:5;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));display:flex;flex-direction:column;align-items:flex-end;gap:7px;pointer-events:none}
.scoreBox{min-width:156px;padding:7px 13px 8px;border:2px solid rgba(255,255,255,.86);border-radius:15px;background:rgba(71,42,88,.9);box-shadow:0 5px 0 rgba(52,40,82,.36);text-align:center;color:#fff;text-shadow:0 2px 2px rgba(0,0,0,.2)}
.scoreLabel{font-size:10px;font-weight:950;letter-spacing:.13em}.scoreValue{font-size:26px;line-height:1.05;font-weight:1000;color:#ffe377;margin-top:2px}
#pause{pointer-events:auto;min-width:116px;min-height:43px;padding:0 15px;border:2px solid rgba(255,255,255,.9);border-radius:14px;background:#eb64ad;color:#fff;font:950 15px ui-rounded,"SF Pro Rounded",system-ui,sans-serif;box-shadow:0 5px 0 rgba(71,47,104,.4);cursor:pointer}
#pause:active{transform:translateY(2px);box-shadow:0 3px 0 rgba(71,47,104,.4)}
#hint{position:absolute;z-index:4;left:50%;bottom:9px;transform:translateX(-50%);padding:7px 14px;border:1px solid rgba(255,255,255,.82);border-radius:999px;background:rgba(25,35,42,.58);color:white;font-size:12px;font-weight:900;white-space:nowrap;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.4);transition:opacity .3s}
#pauseLayer{position:absolute;z-index:3;inset:0;display:none;place-items:center;background:rgba(33,25,54,.18);pointer-events:none}.paused #pauseLayer{display:grid}
#pauseLayer span{font-size:clamp(22px,5vw,46px);font-weight:1000;color:#fff;text-shadow:0 4px 8px rgba(0,0,0,.42)}
#loading{position:absolute;z-index:8;inset:0;display:grid;place-items:center;background:#72b9f7;color:white;font-weight:900;font-size:18px;text-shadow:0 2px 4px rgba(0,0,0,.2)}
#loading.hidden{display:none}
@media(max-width:560px){.scoreBox{min-width:124px;padding:5px 9px 6px;border-radius:12px}.scoreLabel{font-size:7px}.scoreValue{font-size:20px}#pause{min-width:96px;min-height:37px;font-size:12px;border-radius:12px}#hud{gap:5px;top:6px;right:6px}#hint{font-size:10px;padding:5px 10px;bottom:6px}}
@media(orientation:landscape){#gameShell{width:min(100vw,1200px);max-height:100vh;max-height:100svh}}
</style>
</head>

const values={watermelon:10,strawberry:20,chocolate:30};
const imgs={run:[],items:{}};
let paused=false,last=0,bgOffset=0,anim=0,spawnTimer=.75,score=0,best=0,raf=0;
try{best=Number(localStorage.getItem('fusun-ece-best')||0)||0}catch(e){} bestEl.textContent=best;
const player={x:105,y:0,w:310,h:310,vy:0,jumping:false}; player.y=GROUND-player.h;
const things=[],pops=[];
function loadImage(src){return new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>reject(new Error(src));i.src=src})}
async function loadAll(){
  try{
    imgs.bg=await loadImage(files.bg);
    imgs.run=await Promise.all(files.run.map(loadImage));
    for(const k of Object.keys(files.items)) imgs.items[k]=await loadImage(files.items[k]);
    loading.classList.add('hidden'); last=performance.now(); raf=requestAnimationFrame(loop);
  }catch(err){loading.textContent='Görsel yükleme hatası: '+String(err.message||err); console.error(err)}
}
function jump(){if(paused)return;if(!player.jumping){player.jumping=true;player.vy=-870;hint.style.opacity='0'}}
function setPause(v){paused=v;shell.classList.toggle('paused',v);pauseBtn.textContent=v?'Devam':'Duraklat';last=performance.now()}
pauseBtn.addEventListener('click',e=>{e.stopPropagation();setPause(!paused)});
canvas.addEventListener('pointerdown',e=>{e.preventDefault();jump();shell.focus({preventScroll:true})});
shell.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}else if(e.code==='KeyP'){e.preventDefault();setPause(!paused)}});
function spawn(){
  const kinds=['watermelon','strawberry','chocolate'];const kind=kinds[Math.floor(Math.random()*kinds.length)];
  const size=105;const air=Math.random()<.57;
  things.push({kind,x:W+80,y:air?GROUND-230:GROUND-94,w:size,h:size,spin:(Math.random()-.5)*.65,rot:0});
}
function hit(a,b){const ax=a.x+78,ay=a.y+45,aw=a.w-145,ah=a.h-60;const bx=b.x+16,by=b.y+16,bw=b.w-32,bh=b.h-32;return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by}
function collect(o){score+=values[o.kind];if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('fusun-ece-best',String(best))}catch(e){}}pops.push({x:o.x+o.w/2,y:o.y+20,t:0,text:'+'+values[o.kind]})}
function update(dt){
  const speed=300;bgOffset+=speed*dt;anim+=dt;
  if(player.jumping){player.vy+=2100*dt;player.y+=player.vy*dt;if(player.y>=GROUND-player.h){player.y=GROUND-player.h;player.vy=0;player.jumping=false}}
  spawnTimer-=dt;if(spawnTimer<=0){spawn();spawnTimer=.95+Math.random()*.75}
  for(let i=things.length-1;i>=0;i--){const o=things[i];o.x-=speed*dt;o.rot+=o.spin*dt;if(hit(player,o)){collect(o);things.splice(i,1)}else if(o.x+o.w<-30)things.splice(i,1)}
  for(let i=pops.length-1;i>=0;i--){const p=pops[i];p.t+=dt;p.y-=55*dt;if(p.t>.8)pops.splice(i,1)}
}
function drawBackground(){
  const img=imgs.bg; const s=H/img.height; const bw=img.width*s;
  let x=-(bgOffset % bw);
  if(x>0)x-=bw;
  while(x<W){ ctx.drawImage(img,x,0,bw,H); x+=bw; }
}
function drawItems(){for(const o of things){ctx.save();ctx.translate(o.x+o.w/2,o.y+o.h/2);ctx.rotate(o.rot);ctx.drawImage(imgs.items[o.kind],-o.w/2,-o.h/2,o.w,o.h);ctx.restore()}}
function drawPlayer(){const frame=imgs.run[Math.floor(anim*10)%imgs.run.length];ctx.drawImage(frame,player.x,player.y,player.w,player.h)}
function drawPops(){ctx.textAlign='center';ctx.textBaseline='middle';for(const p of pops){ctx.save();ctx.globalAlpha=Math.max(0,1-p.t/.8);ctx.font='1000 31px ui-rounded,system-ui';ctx.lineWidth=7;ctx.strokeStyle='rgba(75,34,91,.8)';ctx.strokeText(p.text,p.x,p.y);ctx.fillStyle='#fff2a3';ctx.fillText(p.text,p.x,p.y);ctx.restore()}}
function render(){ctx.clearRect(0,0,W,H);drawBackground();drawItems();drawPlayer();drawPops()}
function loop(now){if(!shell.isConnected){cancelAnimationFrame(raf);return}const dt=Math.min(.034,(now-last)/1000||0);last=now;if(!paused)update(dt);render();raf=requestAnimationFrame(loop)}
loadAll();
})();
